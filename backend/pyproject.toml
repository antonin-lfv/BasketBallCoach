[project]
name = "basketballcoach-api"
version = "3.0.0"
description = "API BasketballCoach : comptes, systèmes de jeu, dossiers, partage"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
]

[tool.uv]
# Application exécutée en place, pas un paquet installable
package = false
