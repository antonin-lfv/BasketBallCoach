# Développement : uniquement PostgreSQL, exposé sur localhost:5432.
# L'API et le front tournent en direct sur ta machine (voir README).
#
#   docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bball
      POSTGRES_PASSWORD: bball
      POSTGRES_DB: bball
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

volumes:
  pgdata_dev:
